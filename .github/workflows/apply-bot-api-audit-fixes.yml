name: Apply Bot API Audit Fixes

on:
  push:
    branches: [fix/bot-api-10-3-audit-findings]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: bootstrap Bot API audit fixer' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/bot-api-10-3-audit-findings
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore verified regression tests
        run: |
          # RED was already proven by run 33574912143 before any production fix.
          python .github/scripts/apply_bot_api_audit_fixes.py tests
          git add src/bot/models.rs src/bot/client.rs src/ai/stream.rs src/ai/storage.rs
          git commit -m "test(telegram): reproduce Bot API audit regressions"

      - name: GREEN - apply scoped production fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_bot_api_audit_fixes.py')
          s = p.read_text()
          old = '    new, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = '    new, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          assert old in s
          s = s.replace(old, new, 1)
          old = "        pattern = rf'    (?:#\\[allow\\(clippy::too_many_arguments\\)\\]\\n    )?pub async fn {name}\\(.*?\\n    \\}}\\n\\n    {next_marker}'"
          new = "        next_marker = next_marker.replace('\\\\n', '\\n')\n        pattern = rf'    (?:#\\[allow\\(clippy::too_many_arguments\\)\\]\\n    )?pub async fn {name}\\(.*?\\n    \\}}\\n\\n    {re.escape(next_marker)}'"
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          python .github/scripts/apply_bot_api_audit_fixes.py fixes
          python - <<'PY'
          from pathlib import Path

          p = Path('src/ai/stream.rs')
          s = p.read_text()
          s = s.replace('        self.flush_event(&mut events);\n        Ok(events)', '        self.flush_event(&mut events)?;\n        Ok(events)')
          p.write_text(s)

          p = Path('src/bot/client.rs')
          s = p.read_text()
          s = s.replace('Err(err_msg) if attempt + 1 < MAX_TELEGRAM_ATTEMPTS =>', 'Err(_err_msg) if attempt + 1 < MAX_TELEGRAM_ATTEMPTS =>')
          s = s.replace('Err(error) if attempt + 1 < MAX_TELEGRAM_ATTEMPTS => {\n                        warn!(\n                            "Telegram multipart response decode failed', 'Err(_error) if attempt + 1 < MAX_TELEGRAM_ATTEMPTS => {\n                        warn!(\n                            "Telegram multipart response decode failed')

          old_tracks = '            "sendMessage"\n                | "sendLocation"\n                | "editMessageText"\n                | "editEphemeralMessageText"\n                | "editEphemeralMessageCaption"\n                | "editEphemeralMessageReplyMarkup"\n                | "deleteMessage"\n                | "deleteEphemeralMessage"'
          new_tracks = '            "sendMessage" | "sendLocation"'
          assert old_tracks in s
          s = s.replace(old_tracks, new_tracks, 1)

          old_post = '        let response = self.post_json_raw(method, payload).await?;\n        if response.get("ok").and_then(Value::as_bool) == Some(true) {'
          new_post = '        let response = match self.post_json_raw(method, payload).await {\n            Ok(response) => response,\n            Err(error) => {\n                if Self::tracks_terminal_delivery(method) {\n                    Self::mark_terminal_delivery_failure();\n                }\n                return Err(error);\n            }\n        };\n        if response.get("ok").and_then(Value::as_bool) == Some(true) {'
          assert old_post in s
          s = s.replace(old_post, new_post, 1)

          s = s.replace('    pub async fn edit_ephemeral_message_media_bytes(\n', '    #[allow(clippy::too_many_arguments)]\n    pub async fn edit_ephemeral_message_media_bytes(\n', 1)

          old_edit_terminal = '            return Self::terminal_delivery_error(Self::telegram_api_error(method, &res));'
          assert old_edit_terminal in s
          s = s.replace(old_edit_terminal, '            return Err(Self::telegram_api_error(method, &res));', 1)

          tracker_test = '        assert!(failed);\n\n        let (_, answered) = TelegramBotClient::with_callback_answer_tracking(async {'
          tracker_repl = '        assert!(failed);\n\n        let ((_, isolated_failure), outer_failed) = TelegramBotClient::with_delivery_tracking(async {\n            TelegramBotClient::with_delivery_tracking(async {\n                TelegramBotClient::mark_terminal_delivery_failure();\n            })\n            .await\n        })\n        .await;\n        assert!(isolated_failure);\n        assert!(!outer_failed);\n\n        let (_, answered) = TelegramBotClient::with_callback_answer_tracking(async {'
          assert tracker_test in s
          s = s.replace(tracker_test, tracker_repl, 1)
          p.write_text(s)

          p = Path('src/main.rs')
          s = p.read_text()
          start = '    let delivery = deliver_generated_image_with(\n'
          assert start in s
          s = s.replace(start, '    let (delivery, _) = TelegramBotClient::with_delivery_tracking(deliver_generated_image_with(\n', 1)
          end = '    )\n    .await;\n\n    if let Err(failure) = delivery {'
          assert end in s
          s = s.replace(end, '    ))\n    .await;\n\n    if let Err(failure) = delivery {', 1)
          p.write_text(s)

          p = Path('src/cli.rs')
          s = p.read_text()
          key_plain = '    let mut key_input = String::new();\n    let _ = reader.read_line(&mut key_input);'
          key_checked = '    let mut key_input = String::new();\n    if reader.read_line(&mut key_input).is_err() {\n        return;\n    }'
          s = s.replace(key_plain, '    let key_input = rpassword::read_password().unwrap_or_default();')
          s = s.replace(key_checked, '    let key_input = rpassword::read_password().unwrap_or_default();')
          quick_token_marker = 'print!("  \\x1b[1;37mTelegram Bot Token:\\x1b[0m ");'
          pos = s.index(quick_token_marker)
          tail = s[pos:]
          token_read = '            let mut input = String::new();\n            if reader.read_line(&mut input).is_err() {\n                println!("\\n\\x1b[38;5;244mSetup dibatalkan.\\x1b[0m");\n                return None;\n            }'
          tail = tail.replace(token_read, '            let input = rpassword::read_password().unwrap_or_default();', 1)
          s = s[:pos] + tail
          bind_marker = 'pub(crate) async fn run_cli_telegram_bind(manual_token: Option<&str>) {'
          pos = s.index(bind_marker)
          tail = s[pos:]
          bind_read = '        let mut input = String::new();\n        if io::stdin().read_line(&mut input).is_err() {\n            return;\n        }'
          tail = tail.replace(bind_read, '        let input = rpassword::read_password().unwrap_or_default();', 1)
          s = s[:pos] + tail
          p.write_text(s)
          PY

      - name: Update lockfile and format
        run: |
          cargo check
          cargo fmt --all

      - name: Verify scoped source assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          models = Path('src/bot/models.rs').read_text()
          parser = Path('src/parser.rs').read_text()
          cli = Path('src/cli.rs').read_text()
          client = Path('src/bot/client.rs').read_text()
          main = Path('src/main.rs').read_text()
          assert '#[serde(rename = "voice_note")]' in models
          assert 'serialize_field("type", "button")' in models
          assert 'pub media: Option<Vec<InputRichMessageMedia>>' in models
          assert '"voice_note"' in parser
          assert 'BotSubscriptionUpdated' not in models
          assert 'pub subscription:' not in models
          assert 'addCommunity' not in client
          assert 'removeCommunity' not in client
          assert 'reader.read_line(&mut key_input)' not in cli
          assert cli.count('rpassword::read_password()') >= 3
          assert '"sendMessage" | "sendLocation"' in client
          assert '| "deleteMessage"' not in client[client.index('fn tracks_terminal_delivery'):client.index('pub async fn with_delivery_context')]
          assert '#[allow(clippy::too_many_arguments)]\n    pub async fn edit_ephemeral_message_media_bytes' in client
          assert 'with_delivery_tracking(deliver_generated_image_with(' in main
          print('Scoped assertions passed; Community/subscription remain out of scope.')
          PY

      - name: Full Rust validation
        run: |
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo build --release --locked

      - name: Remove temporary fix harness and commit final patch
        run: |
          git rm .github/scripts/apply_bot_api_audit_fixes.py .github/workflows/apply-bot-api-audit-fixes.yml
          git add -A
          git commit -m "fix(telegram): resolve Bot API 10.3 audit findings"
          git push origin HEAD:fix/bot-api-10-3-audit-findings
