name: Branch Raw Contract Fix

on:
  push:
    branches:
      - fix/bot-api-10-3-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply raw permanent-send contract fix and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/bot/client/raw.rs')
          source = path.read_text()
          needle = '"draft_id": 0'
          if source.count(needle) != 2:
              raise SystemExit(f'expected exactly two raw permanent-send draft_id sentinels, found {source.count(needle)}')
          source = ''.join(line for line in source.splitlines(keepends=True) if needle not in line)
          path.write_text(source)
          PY
          cargo fmt --all
          cargo test --locked --test bot_api_10_3_contract
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot/client/raw.rs
          git commit -m "fix(bot): align raw permanent-send draft contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
