name: Apply hardening checkpoint

on:
  push:
    branches:
      - fix/post-merge-p1-p2-p3-hardening
    paths:
      - '.hardening/**'
      - '.github/workflows/apply-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Apply staged patch and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat .hardening/part00 .hardening/part01 .hardening/part02 .hardening/part03 | base64 -d | gzip -d > /tmp/hardening.patch
          git apply -p3 --check /tmp/hardening.patch
          git apply -p3 /tmp/hardening.patch
          rm -rf .hardening
          rm -f .github/workflows/apply-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete post-merge P1 P2 P3 hardening"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
