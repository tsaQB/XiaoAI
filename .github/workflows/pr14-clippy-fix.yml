name: PR14 one-shot Clippy cleanup

on:
  push:
    branches:
      - fix/bot-api-10-3-hardening
    paths:
      - .github/workflows/pr14-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/bot-api-10-3-hardening
          fetch-depth: 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Scope compatibility lint allowances and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          models = Path('src/bot/models.rs')
          text = models.read_text()
          if '#![allow(unused_imports)]' not in text:
              text = text.replace('#![allow(dead_code)]\n', '#![allow(dead_code)]\n#![allow(unused_imports)]\n', 1)
          models.write_text(text)

          client = Path('src/bot/client.rs')
          text = client.read_text()
          marker = 'impl TelegramBotClient {'
          if '#[allow(dead_code)]\nimpl TelegramBotClient {' not in text:
              if marker not in text:
                  raise SystemExit('TelegramBotClient impl marker not found')
              text = text.replace(marker, '#[allow(dead_code)]\n' + marker, 1)
          client.write_text(text)

          parser = Path('src/parser.rs')
          text = parser.read_text()
          wrappers = [
              'pub fn parse_inline(',
              'pub fn parse_streaming_markdown_to_rich_blocks(',
              'pub fn parse_markdown_to_rich_blocks(',
              'pub fn build_full_rich_message(',
          ]
          for marker in wrappers:
              decorated = '#[allow(dead_code)]\n' + marker
              if decorated not in text:
                  if marker not in text:
                      raise SystemExit(f'parser wrapper marker not found: {marker}')
                  text = text.replace(marker, decorated, 1)
          parser.write_text(text)

          contract = Path('tests/bot_api_10_3_contract.rs')
          text = contract.read_text()
          allow = '#![allow(dead_code, unused_imports)]\n\n'
          if not text.startswith('#![allow(dead_code, unused_imports)]'):
              text = allow + text
          contract.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          cargo check --locked
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot/models.rs src/bot/client.rs src/parser.rs tests/bot_api_10_3_contract.rs
          git commit -m 'chore: scope lint allowances to compatibility facades'
          git push origin HEAD:fix/bot-api-10-3-hardening
