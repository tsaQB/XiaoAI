name: Validate XiaoAI hardening checkpoint

on:
  push:
    branches:
      - checkpoint/hardening-bot-api-10-3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiao-checkpoint-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PATCH_FILE: .checkpoint/XiaoAI-hardening-v0.2.0.patch
  DELTA_FILE: .checkpoint/XiaoAI-final-p1-delta.patch

jobs:
  quality:
    name: Apply patches and run Rust quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify and apply checkpoint patches
        run: |
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          git apply --check "$DELTA_FILE"
          git apply "$DELTA_FILE"
          git diff --check
          test "$(grep -E '^version = "0\.2\.0"$' Cargo.toml | wc -l)" -eq 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Resolve lockfile
        run: cargo generate-lockfile

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiao-final-cargo-lock
          path: Cargo.lock
          retention-days: 3

      - name: Canonical format
        run: cargo fmt --all

      - name: Upload formatted Rust source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xiao-p1-rustfmt-source
          path: src
          retention-days: 3

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  security:
    name: RustSec dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply checkpoint patches
        run: |
          git apply "$PATCH_FILE"
          git apply "$DELTA_FILE"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - name: Resolve lockfile
        run: cargo generate-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit --deny warnings

  armbian:
    name: Linux ARM64 build
    needs: [quality, security]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply checkpoint patches
        run: |
          git apply "$PATCH_FILE"
          git apply "$DELTA_FILE"
      - name: Install ARM64 linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          targets: aarch64-unknown-linux-gnu
      - name: Resolve lockfile
        run: cargo generate-lockfile
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu

  android:
    name: Android ARM64 build
    needs: [quality, security]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply checkpoint patches
        run: |
          git apply "$PATCH_FILE"
          git apply "$DELTA_FILE"
      - name: Setup JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android NDK
        run: sdkmanager --install "ndk;26.3.11579264"
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Resolve lockfile
        run: cargo generate-lockfile
      - name: Build
        run: cargo ndk -t arm64-v8a -P 26 build --release --locked