name: PR14 one-shot SSRF fix

on:
  push:
    branches:
      - fix/bot-api-10-3-hardening
    paths:
      - .github/workflows/pr14-ssrf-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/bot-api-10-3-hardening
          fetch-depth: 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Wire shared URL policy into raw media downloader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/bot/client/raw.rs')
          source = path.read_text()

          import_anchor = '};\nuse futures_util::StreamExt;'
          import_replacement = '};\nuse super::url_policy::resolve_download_url;\nuse futures_util::StreamExt;'
          if 'use super::url_policy::resolve_download_url;' not in source:
              if import_anchor not in source:
                  raise SystemExit('raw transport import anchor not found')
              source = source.replace(import_anchor, import_replacement, 1)

          start = source.find('    pub async fn download_media_bytes(')
          end = source.find('    pub async fn send_photo(', start)
          if start < 0 or end < 0:
              raise SystemExit('download_media_bytes function boundaries not found')

          body = source[start:end]
          if 'resolve_download_url(url)' not in body:
              builder = '        let client = Client::builder()'
              if builder not in body:
                  raise SystemExit('download client builder not found')
              body = body.replace(
                  builder,
                  '        let resolved = resolve_download_url(url).await.ok()?;\n        let client = Client::builder()',
                  1,
              )

          old_build = '            .build()\n            .unwrap_or_else(|_| self.client.clone());'
          new_build = '            .redirect(reqwest::redirect::Policy::none())\n            .resolve(&resolved.host, resolved.address)\n            .build()\n            .ok()?;'
          if old_build not in body:
              raise SystemExit('download client build block not found')
          body = body.replace(old_build, new_build, 1)

          old_get = '        let resp = client.get(url).send().await.ok()?;'
          new_get = '        let resp = client.get(resolved.url).send().await.ok()?;'
          if old_get not in body:
              raise SystemExit('download request line not found')
          body = body.replace(old_get, new_get, 1)

          source = source[:start] + body + source[end:]
          path.write_text(source)
          PY
          cargo fmt --all
          cargo test --locked --test bot_api_10_3_contract
          cargo test --locked bot::url_policy::tests
          cargo check --locked
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot/client/raw.rs
          git commit -m 'fix(bot): enforce outbound media URL policy'
          git push origin HEAD:fix/bot-api-10-3-hardening
