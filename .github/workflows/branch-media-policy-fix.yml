name: Branch Media Policy Fix

on:
  push:
    branches:
      - fix/bot-api-10-3-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Harden external media downloader and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/bot/client/raw.rs')
          source = path.read_text()
          old = '''        let client = Client::builder()
              .timeout(Duration::from_secs(30))
              .user_agent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              .build()
              .unwrap_or_else(|_| self.client.clone());
  
          let resp = client.get(url).send().await.ok()?;
  '''
          # Normalize indentation only for the exact downloader block checked below.
          old = old.replace('              .', '            .').replace('  \n', '\n')
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy downloader client block, found {source.count(old)}')
          new = '''        let target = super::url_policy::resolve_download_url(url).await.ok()?;
          let client = Client::builder()
              .connect_timeout(Duration::from_secs(10))
              .timeout(Duration::from_secs(30))
              .redirect(reqwest::redirect::Policy::none())
              .resolve(&target.host, target.address)
              .user_agent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              .build()
              .ok()?;
  
          let resp = client.get(target.url).send().await.ok()?;
  '''
          new = new.replace('              .', '            .').replace('  \n', '\n')
          path.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo check --locked
          cargo test --locked bot::url_policy::tests
          cargo test --locked --test bot_api_10_3_contract
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot/client/raw.rs src/bot/url_policy.rs src/bot/mod.rs tests/bot_api_10_3_contract.rs
          git commit -m "fix(bot): harden external media downloads"
          git push origin "HEAD:${GITHUB_REF_NAME}"
