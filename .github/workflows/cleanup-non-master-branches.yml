name: Cleanup non-master branches

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-non-master-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'tsaQB/XiaoAI'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Delete non-master refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            'checkpoint/hardening-bot-api-10-3' \
            'final/hardening-bot-api-10-3'
          do
            if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              echo "Deleted $branch"
            else
              echo "Already absent: $branch"
            fi
          done
