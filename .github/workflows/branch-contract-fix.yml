name: Branch Contract Fix

on:
  push:
    branches:
      - fix/bot-api-10-3-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply exact contract fix and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/bot/client.rs')
          source = path.read_text()
          inline = 'json!({"chat_id": chat_id, "draft_id": 0, "text": chunk})'
          rich = '                "draft_id": 0,\n'
          if source.count(inline) != 1:
              raise SystemExit(f'expected exactly one permanent sendMessage draft_id occurrence, found {source.count(inline)}')
          if source.count(rich) != 1:
              raise SystemExit(f'expected exactly one permanent sendRichMessage draft_id occurrence, found {source.count(rich)}')
          source = source.replace(inline, 'json!({"chat_id": chat_id, "text": chunk})', 1)
          source = source.replace(rich, '', 1)
          path.write_text(source)
          PY
          cargo fmt --all
          cargo test --locked --test bot_api_10_3_contract
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot/client.rs
          git commit -m "fix(bot): omit draft id from permanent sends"
          git push origin "HEAD:${GITHUB_REF_NAME}"
